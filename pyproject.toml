[project]
name = "tg-translation-deepl-bot"
version = "0.2.1"
description = "Universal Telegram translation bot with DeepL and LLM multi-provider support, per-user settings, and real-time streaming"
authors = [{ name = "Developer" }]
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.17.0",
    "aiohttp>=3.10.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
